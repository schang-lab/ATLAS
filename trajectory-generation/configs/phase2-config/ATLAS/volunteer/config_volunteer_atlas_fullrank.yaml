# VOLUNTEER ATLAS on California full-rank / mixture LLP-world.
#
# Mirrors the data/loss/training intent of:
#   trajectory-generation/configs/california-vae/ca_mix-vae-js-23.yaml
# but uses the VOLUNTEER-specific trainer:
#   python train_volunteer_setups.py --config config_volunteer_atlas_fullrank.yaml
#
# IMPORTANT:
# - experiment.init_checkpoint should point to the home/work-only VOLUNTEER
#   baseline checkpoint.
# - data.split_data_dir may be a nodemo split; ATLAS masks per-trajectory demo
#   labels for its VAE regularizer by default.

experiment:
  setup: atlas
  init_checkpoint: /path/to/output/runs/volunteer_baseline/baseline_final.pt

model:
  vocab_size: 9506
  loc_emb_size: 256
  tim_emb_size: 64
  demo_emb_size: 128
  pos_emb_size: 64
  hidden_size: 512
  latent_size: 256
  dropout: 0.2
  num_age_bins: 4
  num_genders: 2
  max_seq_len: 64
  tim_buckets: 1440
  num_special_tokens: 5
  use_demo_condition: true
  demo_conditioning_type: legacy

data:
  split_data_dir: /path/to/embee_ca_nodemo/controlled
  num_workers: 4

atlas:
  # TRAIN split LLP-world caches + region-level POI marginals.
  cbg_cache_dir: /path/to/atlas_world/embee_ca_mixturegroups/cache/train
  poi_marginal_csv: /path/to/atlas_world/embee_ca_mixturegroups/aggregates/train/p_poi.csv
  allowed_cbgs: []
  # pi = true LLP: sample demographic ids from pi_region and use them for
  # both conditioning and LLP grouping.
  demo_source: pi
  aggregate_loss:
    type: js
    epsilon: 1.0e-8
  llp:
    enabled: true
    min_per_group: 0

  # Held-out aggregate validation on VAL LLP-world.
  validation:
    enabled: true
    cbg_cache_dir: /path/to/atlas_world/embee_ca_mixturegroups/cache/val
    poi_marginal_csv: /path/to/atlas_world/embee_ca_mixturegroups/aggregates/val/p_poi.csv
    allowed_cbgs: []
    demo_source: inherit
    num_batches: 10
    batch_size: 1024
    log_by_cbg: true
    max_cbgs_to_log: 0

training:
  steps: 20000
  batch_size: 512
  aggregate_batch_size: 1024
  lr: 1.0e-6
  lambda_agg: 1.0
  # Optional reconstruction/ELBO regularizer on real trajectories during ATLAS.
  # Default nulls demo IDs to avoid per-trajectory demo supervision leakage.
  lambda_vae: 1.0
  vae_regularizer_demo_source: null
  lambda_entropy: 0.0
  log_every: 1
  val_every: 10
  save_every: 5000
  output_dir: /path/to/output/runs/volunteer_atlas_fullrank_js_lambda_1_lr_1e-6_seed_23
  max_grad_norm: 1.0
  wandb: true
  wandb_project: volunteer-atlas-aggregate
  wandb_run_name: volunteer-fullrank-js-lambda-1-lr-1e-6-seed-23

device: cuda
seed: 23
