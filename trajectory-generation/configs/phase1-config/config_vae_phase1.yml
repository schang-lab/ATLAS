# VAE backbone configuration for ATLAS framework
# Phase 1: operates on BART encoder outputs (d_model=512, seq_len=512)

VAE:
    image_size: 64         # sequence length (must match BART max_length)
    in_channels: 256       # BART d_model (or PCA dim if using latent PCA)
    hidden_size: 256       # internal transformer dimension
    latent_code_dim: 64    # VAE bottleneck dimension
    encoder_layers: 4      # transformer encoder layers
    decoder_layers: 4      # transformer decoder layers
    num_heads: 8
    dropout: 0.1
    beta_kl: 0.001         # KL weight (start small, can anneal)
